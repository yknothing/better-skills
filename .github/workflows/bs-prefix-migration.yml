name: BS prefix namespace migration

on:
  push:
    branches:
      - agent/bs-prefix-namespace

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bs-prefix-namespace

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply namespace migration
        run: |
          cat .migration-chunks/part-* | base64 -d > /tmp/migrate-bs-prefix.js
          node /tmp/migrate-bs-prefix.js

      - name: Validate migrated repository
        run: |
          set -euo pipefail
          for d in skills/bs-*; do
            node tools/validate.js "$d"
          done
          node tools/pattern-alignment.js --strict
          node tools/peer-review.js check --all
          node evaluation/harness/runner.js
          bash tools/check-patterns.sh
          bash tools/test-cli.sh
          git diff --check

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .migration-chunks
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: namespace all skills with bs prefix"
          git push origin HEAD:agent/bs-prefix-namespace
