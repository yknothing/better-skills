name: BS prefix namespace migration

on:
  push:
    branches:
      - agent/bs-prefix-namespace
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bs-prefix-namespace

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply namespace migration
        id: migrate
        shell: bash
        run: |
          set +e
          cat .migration-js/part-* > /tmp/migrate-bs-prefix.js
          node --check /tmp/migrate-bs-prefix.js > /tmp/migration.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            node /tmp/migrate-bs-prefix.js >> /tmp/migration.log 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            node .migration-components/post-migrate.js >> /tmp/migration.log 2>&1
            rc=$?
          fi
          cat /tmp/migration.log
          exit "$rc"

      - name: Validate migrated repository
        id: validate
        shell: bash
        run: |
          set +e
          fail=0
          {
            for d in skills/bs-*; do
              node tools/validate.js "$d" || fail=1
            done
            node tools/pattern-alignment.js || fail=1
            node tools/peer-review.js check --all || fail=1
            node evaluation/harness/runner.js || fail=1
            bash tools/check-patterns.sh || fail=1
            bash tools/test-cli.sh || fail=1
            git diff --check || fail=1
            exit "$fail"
          } > /tmp/validation.log 2>&1
          rc=$?
          cat /tmp/validation.log
          exit "$rc"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bs-prefix-migration-diagnostics
          path: |
            /tmp/migration.log
            /tmp/validation.log
            tools/test-cli.sh

      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .migration-js .migration-components .migration-chunks
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: namespace all skills with bs prefix"
          git push origin HEAD:agent/bs-prefix-namespace
